services:
  router:
    build: .
    ports:
    - 127.0.0.1:8000:8000
    environment:
      LITELLM_URL: http://litellm:4000
      QUOTA_DB: /data/quota.sqlite3
      LOCAL_ONLY: ${LOCAL_ONLY:-true}
    volumes:
    - ./rules.yaml:/app/rules.yaml:ro
    - ./free-pool.yaml:/app/free-pool.yaml:ro
    - quota:/data
    depends_on:
    - litellm
    env_file: .env
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command:
    - --config
    - /app/config.yaml
    - --port
    - '4000'
    env_file: .env
    volumes:
    - ./litellm.yaml:/app/config.yaml:ro
    environment:
      LOCAL_CODE_MODEL: ${LOCAL_CODE_MODEL:-ollama_chat/qwen2.5-coder:7b}
      LOCAL_GENERAL_MODEL: ${LOCAL_GENERAL_MODEL:-ollama_chat/qwen3:8b}
      LOCAL_REASONING_MODEL: ${LOCAL_REASONING_MODEL:-ollama_chat/qwen3:8b}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
    extra_hosts:
    - host.docker.internal:host-gateway
  ollama:
    image: ollama/ollama:latest
    volumes:
    - ollama:/root/.ollama
    profiles:
    - bundled
volumes:
  ollama: null
  quota: null
