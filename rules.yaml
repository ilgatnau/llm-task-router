# Ordered rules: first match wins. Explicit model choice overrides these rules.
default: free-code
rules:
- name: private-local
  pattern: (?i)^\s*/(?:local|private)\b
  model: local-code
- name: explicit-tests
  pattern: (?i)^\s*/tests?\b
  model: local-code
- name: explicit-online
  pattern: (?i)^\s*/(?:online|cloud)\b
  model: free-code
- name: explicit-architecture
  pattern: (?i)^\s*/(?:architect|reason)\b
  model: free-architecture
- name: explicit-cicd
  pattern: (?i)^\s*/(?:cicd|deploy)\b
  model: free-cicd
- name: explicit-code
  pattern: (?i)^\s*/code\b
  model: free-code
- name: architecture-and-hard-debugging
  pattern: (?i)\b(architecture|system design|design trade.?offs?|security audit|race condition|deadlock|complex debugging)\b
  model: free-architecture
- name: pipelines-and-infrastructure
  pattern: (?i)\b(ci/cd|ci-cd|github actions|gitlab ci|jenkins|dockerfile|terraform|kubernetes|helm|deployment|deployments|deploy|pipeline|pipelines)\b
  model: free-cicd
- name: integration-testing
  pattern: (?i)\b(integration tests?|end.to.end tests?|contract tests?|test strategy)\b
  model: free-code
- name: routine-unit-tests
  pattern: (?i)\b(unit tests?|unit testing|test coverage|pytest|jest|vitest|junit|mocking|test cases?)\b
  model: local-code
- name: implementation
  pattern: (?i)\b(implement|implementation|implementing|refactor|refactoring|multi-file|bug fix|fix bug|write code|add feature|production migration)\b
  model: free-code
- name: writing-and-summary
  pattern: (?i)\b(summarize|translate|rewrite prose|write documentation)\b
  model: local-general
